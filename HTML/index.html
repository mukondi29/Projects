<!DOCTYPE html>
<html>
<head>
    <title>Ninja</title>
    <style>
       * {
            box-sizing: border-box;
        }
        .column{
            float: left;
            width: 33.33%;
            padding: 10px;
            height: 400px;
        }
        .row:after {
            content: "";
            display: table;
            clear: both
        }
    </style>
</head>
<body>

    <p>
        Hello ninjas
    </p>
    <p>My first webpage</p>
    <section class="row">
        <section class="column" style="background-color: rgb(6, 109, 109);">
            <h2>Suggestions</h2>
            <p>Some suggestions will go here</p>
        </section>
        <section class="column" style="background-color: rgb(10, 113, 113);">
            <h2>History</h2>
            <p>History to be shown here</p>
        </section>
        <section class="column" style="background-color: rgb(13, 120, 120);">
            <h2>Recommendations</h2>
            <p>We recommend you look at these documents</p>
        </section>
    </section>

</body>

</html>
